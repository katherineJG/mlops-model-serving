name: Release image

# Manual only. Nothing publishes on push, PR or tag.
#
# Two gates: the `guard` job checks the run is on main, started by the owner, with a valid
# version, a matching confirmation and a green CI run for the commit. The `publish` job then
# waits for approval from a required reviewer on the `release` environment (Settings >
# Environments) before it builds and pushes anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish, MAJOR.MINOR.PATCH (e.g. 0.1.0)"
        required: true
        type: string
      confirm:
        description: "Type the version again to confirm you want to publish it"
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ inputs.version }}  # via env, never interpolated into scripts
      CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check release conditions
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Releases can only be run from main (got $GITHUB_REF)."
          [ "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" ] || fail "Only the repository owner can release."
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || fail "Version must look like 1.2.3."
          [ "$CONFIRM" = "$VERSION" ] || fail "Confirmation does not match the version."
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                 --status success --json conclusion --jq length)
          [ "${ok:-0}" -ge 1 ] || fail "No successful CI run for commit $GITHUB_SHA."

  publish:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run python -m pytest -v
      - name: Build
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$IMAGE:$VERSION" --build-arg SOURCE_REVISION=${{ github.sha }} .
      - name: Container tests against the exact image being published
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          MSS_IMAGE="$IMAGE:$VERSION" uv run python -m pytest tests/integration/test_container.py -v
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push
        run: docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
