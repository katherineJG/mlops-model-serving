name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      # unit, contract and ASGI/socket integration tests; container tests skip without MSS_IMAGE
      - run: uv run python -m pytest -v

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Build image (not pushed)
        run: docker build -t mlops-model-serving:ci --build-arg SOURCE_REVISION=${{ github.sha }} .
      - name: Container smoke and HTTP tests
        run: MSS_IMAGE=mlops-model-serving:ci uv run python -m pytest tests/integration/test_container.py -v
